apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

kapt {
    correctErrorTypes = true
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.anshmidt.multialarm"
        minSdkVersion 23
        targetSdkVersion 31
        multiDexEnabled true
        versionCode 3
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    productFlavors {
    }
    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    packagingOptions {
        pickFirst 'mockito-extensions/org.mockito.plugins.MockMaker'
    }
    testOptions {
        animationsDisabled = true
    }
    dataBinding {
        enabled = true
    }
    useLibrary 'android.test.mock'
    namespace 'com.anshmidt.multialarm'

}

dependencies {
    def koin_version = "3.5.0"
    def mockito_version = "2.21.0"

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'


    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    //RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    //ViewModel
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.6"

    //Dependency injection
    implementation "io.insert-koin:koin-android:$koin_version"
    testImplementation "io.insert-koin:koin-test:$koin_version"
    androidTestImplementation "io.insert-koin:koin-test:$koin_version"
    implementation "io.insert-koin:koin-core:$koin_version"

    //Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.9"

    //Testing
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    testImplementation "org.mockito:mockito-inline:$mockito_version"
    testImplementation "org.mockito:mockito-core:$mockito_version"
    androidTestImplementation "org.mockito:mockito-android:$mockito_version"
    testImplementation "androidx.arch.core:core-testing:2.1.0"
    testImplementation "com.nhaarman.mockitokotlin2:mockito-kotlin:2.2.0"
    androidTestImplementation 'com.android.support.test.uiautomator:uiautomator-v18:2.1.3'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.4'
    testImplementation "androidx.test:core:1.6.1"

    //Data binding
    kapt "com.android.databinding:compiler:$gradle_version"

    //LocalDateTime for API < 26
    implementation 'com.jakewharton.threetenabp:threetenabp:1.2.1'
    testImplementation("org.threeten:threetenbp:1.4.0") {
        exclude module: "com.jakewharton.threetenabp:threetenabp:1.2.0"
    }

    //Fragments
    implementation "androidx.fragment:fragment-ktx:1.8.4"

    //Rx
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.9'

    //Preferences
    implementation 'androidx.preference:preference:1.2.0'

    //Animated button
    implementation 'pl.bclogic:pulsator4droid:1.0.3'

    //Preferences DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    //SharedPreferences to Flow
    implementation 'com.fredporciuncula:flow-preferences:1.8.0'

    //Material
    //implementation 'com.google.android.material:material:1.6.1'

    //Cardview
    implementation 'androidx.cardview:cardview:1.0.0'

    //Logging to file
    implementation 'org.tinylog:tinylog-api:2.4.1'
    runtimeOnly 'org.tinylog:tinylog-impl:2.4.1'

}
repositories {
    mavenCentral()
}
